<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hammer List — Dashboard</title>
<style>
/* ============================================================
   CONFIG NOTE: All Supabase settings live in the <script> at the
   bottom under "const CONFIG". If a column name in your tables is
   different, change it there in one place. No terminal needed.
   ============================================================ */
:root{
  --green:#0071e3; --green-d:#0058b8; --green-l:#0077ed;
  --accent:#0071e3;
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --line:#d2d2d7; --line-2:#c7c7cc;
  --ok:#248A3D; --ok-bg:#E3F9E9; --ok-br:#A7E3B5;
  --warn:#C25E00; --warn-bg:#FFF4E5; --warn-br:#FFD8A8;
  --bad:#D70015; --bad-bg:#FFEBE9; --bad-br:#FFC7C2;
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.serif{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:600;letter-spacing:-.022em}
input,select,button,textarea{font-family:inherit}
a{color:inherit}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-mark{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.login-mark .m{display:flex;align-items:center;justify-content:center;font-size:24px}
.login-mark .t{font-size:17px;font-weight:600;letter-spacing:-.014em;color:var(--ink)}
.login-h{font-size:22px;color:var(--ink);margin-bottom:5px}
.login-s{font-size:13px;color:var(--ink-2);margin-bottom:24px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.fld input{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:14px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--green-l);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.btn-primary{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:980px;font-size:15px;font-weight:500;letter-spacing:-.01em;cursor:pointer;transition:background .2s,transform .1s}
.btn-primary:hover{background:#000}
.btn-primary:active{transform:scale(.985)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.login-err{font-size:12px;color:var(--bad);margin-top:12px;display:none}
.login-demo{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.login-demo a{font-size:12px;color:var(--green-l);cursor:pointer;font-weight:500}
.login-demo a:hover{text-decoration:underline}

/* ---------- App shell ---------- */
#app{display:none}
.topnav{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);height:52px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}
.tn-l{display:flex;align-items:center;gap:10px}
.tn-mark{display:flex;align-items:center;justify-content:center;font-size:18px}
.tn-word{color:var(--ink);font-weight:600;font-size:14px;letter-spacing:-.01em}
.tn-bc{font-size:13px;color:var(--ink-2)}
.tn-bc .sep{color:var(--ink-3);margin:0 6px}.tn-bc .cur{color:var(--ink);font-weight:500}
.tn-bc .lnk{cursor:pointer}.tn-bc .lnk:hover{color:var(--accent)}
.tn-r{display:flex;align-items:center;gap:14px}
.demo-badge{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#8a4500;background:#FFD8A8;padding:3px 9px;border-radius:100px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#34C759}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:11px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tn-menu{position:relative}
.tn-dd{position:absolute;top:38px;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.1);display:none;overflow:hidden;z-index:60}
.tn-dd.open{display:block}
.tn-dd-item{padding:10px 14px;font-size:13px;color:var(--ink);cursor:pointer}
.tn-dd-item:hover{background:var(--surface-2)}
.tn-dd-item.sub{font-size:11px;color:var(--ink-3);cursor:default;border-bottom:1px solid var(--line)}

/* ---------- Tabs ---------- */
.subtabs{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);display:flex;padding:0 22px;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:49}
.subtab{padding:12px 14px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.subtab:hover{color:var(--ink)}
.subtab.act{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ---------- Page ---------- */
.page{max-width:1080px;margin:0 auto;padding:22px}
.hidden{display:none!important}
.muted{color:var(--ink-2)}
.sec-t{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:3px}
.sec-s{font-size:12px;color:var(--ink-2);margin-bottom:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.gn{background:var(--ink);border-color:transparent}
.card.gs{background:var(--ok-bg);border-color:var(--ok-br)}
.card.sur{background:var(--surface-2);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
@media(max-width:720px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}

.lbl{display:block;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.gn .lbl{color:rgba(255,255,255,.78)}.gs .lbl{color:var(--ok)}
.num{font-size:24px;font-weight:500;line-height:1;color:var(--ink)}
.gn .num{color:#fff}.gs .num{color:#0b6b2e}
.sub{font-size:11px;color:var(--ink-2);margin-top:6px}
.gn .sub{color:rgba(255,255,255,.72)}.gs .sub{color:var(--ok)}
.delta{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.d-up{color:#0b6b2e;background:#E3F9E9}.d-dn{color:#b00010;background:#FFEBE9}

.chip{font-size:10px;font-weight:600;padding:3px 9px;border-radius:100px;display:inline-block}
.chip-on{color:#0b6b2e;background:#E3F9E9}
.chip-at{color:#8a4500;background:#FFF4E5}
.chip-bh{color:#b00010;background:#FFEBE9}
.trade{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);padding:3px 9px;border-radius:100px;border:1px solid var(--line)}

/* client cards */
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cc:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.cc.at{border-left:3px solid var(--warn-br)}
.cc.bh{border-left:3px solid var(--bad)}
.cc-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:13px}
.cc-n{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:4px}
.cc-m{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cc-ring{display:flex;align-items:center;gap:11px;padding:11px;background:var(--surface-2);border-radius:var(--r-sm);margin-bottom:13px}
.cc-ring-a{font-size:12px;font-weight:500;color:var(--ink)}
.cc-ring-p{font-size:10px;color:var(--ink-2);margin-top:2px}
.cc-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
.cc-mini-l{font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.cc-mini-v{font-size:14px;font-weight:500;color:var(--ink)}
.cc-f{font-size:10px;color:var(--ink-2);padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between}

/* metric cards (client view) */
.mc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.mc.gn{background:var(--ink);border-color:transparent}
.mc-l{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-bottom:7px}
.mc.gn .mc-l{color:rgba(255,255,255,.62)}
.mc-v{font-size:19px;font-weight:500;color:var(--ink);line-height:1}
.mc.gn .mc-v{color:#fff}
.mc-m{display:flex;align-items:center;gap:5px;margin-top:5px}
.mc-s{font-size:10px;color:var(--ink-2)}.mc.gn .mc-s{color:rgba(255,255,255,.62)}

.back{background:none;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 14px;cursor:pointer;font-size:12px;color:var(--ink-2);margin-bottom:14px;display:inline-flex;align-items:center;gap:5px}
.back:hover{background:var(--surface-2)}

.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}

/* tables */
.th{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.as{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px}
.as-cf{color:#248A3D;background:#E3F9E9}.as-cl{color:#fff;background:#248A3D}.as-ns{color:#b00010;background:#FFEBE9}.as-pe{color:#6e6e73;background:#f5f5f7}

/* budget inputs */
.inp{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 11px;font-size:14px;color:var(--ink);width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--green-l);box-shadow:0 0 0 3px rgba(0,113,227,.1)}
.inp.serif{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:600;letter-spacing:-.022em}
input[type=range]{accent-color:var(--green-l);width:100%;height:5px}
.delbtn{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:18px;padding:2px 5px;border-radius:5px;line-height:1}
.delbtn:hover{color:var(--bad);background:var(--bad-bg)}
.addbtn{background:none;border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:9px 14px;cursor:pointer;font-size:12px;color:var(--ink-2);width:100%;margin-top:10px}
.addbtn:hover{border-color:var(--green-l);color:var(--green-l)}
.savebtn{background:var(--ink);border:none;border-radius:var(--r-sm);padding:8px 16px;cursor:pointer;font-size:12px;color:#fff;font-weight:500}
.savebtn:hover{background:#000}
.prog-wrap{background:var(--surface-2);border-radius:100px;height:7px;overflow:hidden;margin:5px 0 9px}
.prog-fill{height:100%;border-radius:100px;background:var(--green-l)}
.alert{padding:10px 13px;border-radius:var(--r-sm);font-size:12px;display:flex;gap:8px;align-items:flex-start}
.alert-warn{background:var(--warn-bg);border:1px solid var(--warn-br);color:#8a4500}
.alert-ok{background:var(--ok-bg);border:1px solid var(--ok-br);color:var(--ok)}
.alert-bad{background:var(--bad-bg);border:1px solid var(--bad-br);color:#b00010}

.empty{text-align:center;padding:50px 20px;color:var(--ink-2)}
.empty .ico{font-size:34px;margin-bottom:10px;opacity:.4}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--green-l);border-radius:50%;animation:sp .7s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.save-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;opacity:0;transition:transform .3s,opacity .3s;z-index:200}
.save-toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ---------- Live activity calendar ---------- */
.la-hd{background:var(--ink);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;color:#fff}
.la-hd .t{font-size:20px;margin-bottom:5px}
.la-hd .s{font-size:13px;color:#A7E3B5;max-width:560px;line-height:1.5}
.la-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#ffffff;background:rgba(255,255,255,.12);padding:4px 11px;border-radius:100px;margin-bottom:12px}
.la-live .dot{width:7px;height:7px;border-radius:50%;background:#34C759;box-shadow:0 0 0 0 rgba(52,199,89,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.6)}70%{box-shadow:0 0 0 7px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:13px}
.cal-pills{display:flex;gap:6px;flex-wrap:wrap}
.cal-pill{padding:6px 13px;border-radius:100px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:500;cursor:pointer}
.cal-pill.act{background:var(--ink);border-color:var(--ink);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:4px 0}
.cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:92px;padding:6px 6px 7px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.today{border-color:var(--green-l);box-shadow:0 0 0 2px rgba(0,113,227,.14)}
.cal-cell.future{opacity:.55}
.cal-dn{font-size:10px;font-weight:600;color:var(--ink-2);margin-bottom:1px}
.cal-cell.today .cal-dn{color:var(--green-l)}
.cal-ev{font-size:9px;line-height:1.25;padding:3px 5px;border-radius:5px;background:var(--ok-bg);border-left:2px solid var(--ok-br);color:#0b6b2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev.new{background:#FFF4E5;border-left-color:var(--accent);color:#8a4500}
.cal-ev .nm{filter:blur(3.5px);user-select:none;-webkit-user-select:none;pointer-events:none}
span.nm{filter:blur(3.5px);user-select:none;-webkit-user-select:none;pointer-events:none}
.cal-more{font-size:9px;color:var(--ink-3);font-weight:600;padding-left:3px}
.cal-newbadge{position:absolute;top:5px;right:5px;font-size:7px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--accent);padding:1px 5px;border-radius:100px}
.la-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.la-stat .n{font-size:22px;font-weight:500;color:var(--ink)}
.la-stat.gn{background:var(--ink);border-color:transparent}.la-stat.gn .n{color:#fff}
.la-note{font-size:11px;color:var(--ink-3);margin-top:13px;text-align:center}
</style>
</head>

<div id="login">
  <div class="login-card">
    <div class="login-mark"><div class="m">🔨</div><div class="t">The Hammer List</div></div>
    <div class="login-h serif">Welcome back</div>
    <div class="login-s">Sign in to your growth dashboard</div>
    <div class="fld"><label>Email</label><input type="email" id="li-email" placeholder="you@company.com" autocomplete="email"></div>
    <div class="fld"><label>Password</label><input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" id="li-btn" onclick="doLogin()">Sign in</button>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topnav">

      <div class="tn-mark">🔨</div>

    </div>

<div class="save-toast" id="toast">Saved</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   CONFIG — the only place you edit if anything changes.
   Publishable (anon) key only — safe to expose. RLS does security.
   ════════════════════════════════════════════════════════════ */
const CONFIG = {
  url: 'https://zaxowlcsraiknvvxddyg.supabase.co',
  anonKey: 'sb_publishable_Xxq_FQ5FwSz5QrvGpN_HKQ_ai_guQ2n',
  // Admin emails see ALL clients. Put your own login email here.
  adminEmails: ['admin@thehammerlist.com'],
  // Table + column names — change here if yours differ.
  tables: {
    clients: 'clients',
    metrics: 'metrics',
    appointments: 'appointments',
    closedJobs: 'closed_jobs',
    budget: 'budget_data'
  },
  cols: {
    apptId: 'ghl_appt_id',
    apptAt: 'appt_at',
    spend: 'spend'
  },
  guarantee: 15,
  // Projection assumptions for the prospect-facing "potential" view
  closeRate: 0.50
};

const sb = window.supabase.createClient(CONFIG.url, CONFIG.anonKey);

/* ---------- session state ---------- */
const S = {
  demo:false, isAdmin:false, user:null,
  clients:[], activeClientId:null, tab:'overview', budget:null,
  period:null, customStart:'', customEnd:''
};

const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY = new Date();
const DPM = new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
const DAY = TODAY.getDate();

/* ---------- date period ---------- */
function makePeriod(key, cs, ce){
  const y=TODAY.getFullYear(), m=TODAY.getMonth();
  let start,end,label,months,live=false;
  if(key==='last_month'){ start=new Date(y,m-1,1); end=new Date(y,m,0); label='Last month'; months=1; }
  else if(key==='last_3'){ start=new Date(y,m-2,1); end=new Date(y,m+1,0); label='Last 3 months'; months=3; live=true; }
  else if(key==='last_6'){ start=new Date(y,m-5,1); end=new Date(y,m+1,0); label='Last 6 months'; months=6; live=true; }
  else if(key==='ytd'){ start=new Date(y,0,1); end=new Date(y,m+1,0); label='Year to date'; months=m+1; live=true; }
  else if(key==='custom'){ start=new Date(cs); end=new Date(ce); label='Custom range'; months=Math.max(1,Math.round((end-start)/2592000000)); }
  else { key='this_month'; start=new Date(y,m,1); end=new Date(y,m+1,0); label='This month'; months=1; live=true; }
  const len=end-start;
  const prevEnd=new Date(start.getTime()-86400000);
  const prevStart=new Date(start.getTime()-len);
  return {key,start,end,prevStart,prevEnd,label,months,live};
}
const PERIOD_OPTS=[['this_month','This month'],['last_month','Last month'],['last_3','Last 3 months'],['last_6','Last 6 months'],['ytd','Year to date'],['custom','Custom range']];
function dISO(d){ return d.toISOString(); }
function dDATE(d){ return d.toISOString().slice(0,10); }

/* ---------- formatters ---------- */
const f$=n=>{n=Number(n)||0;const a=Math.abs(n),s=n<0?'-':'';if(a>=100000)return s+'$'+Math.round(a/1000)+'k';if(a>=1000)return s+'$'+(a/1000).toFixed(1)+'k';return s+'$'+Math.round(a);};
const fN=n=>(Number(n)||0).toLocaleString();
const fp=n=>Math.round(Number(n)||0)+'%';
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=el('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function deltaHtml(cur,prev,inverse){
  if(!prev||prev===0)return '';
  const v=Math.round((cur-prev)/Math.abs(prev)*100);
  const good=inverse?v<0:v>=0;
  return `<span class="delta ${good?'d-up':'d-dn'}">${v>=0?'↑':'↓'} ${Math.abs(v)}%</span>`;
}

function recomputeDemoForPeriod(){
  const N=S.period.months, key=S.period.key;
  S.clients.forEach(c=>{
    let idSeed=0; for(const ch of c.id) idSeed+=ch.charCodeAt(0);
    let appts,spend;
    if(key==='this_month'){
      // 10 days in: month-to-date pace of the monthly volume; spend = daily rate x days elapsed
      appts=Math.round(c.monthly*DAY/DPM);
      spend=c.rate*DAY;
      const pm=0.9+laRng(idSeed*53)()*0.15;      // prior month-to-date for delta
      c.prev={appts:Math.round(appts*pm),spend:Math.round(c.rate*DAY*(0.96+laRng(idSeed*59)()*0.06))};
    } else if(N<=1){
      // last month: full month of volume and ~30 days of ad budget
      const r=laRng(idSeed*61);
      appts=Math.round(c.monthly*(0.92+r()*0.16));
      spend=Math.round(c.rate*30*(0.97+r()*0.05)); // budgets are fixed daily; small delivery variance only
      c.prev={appts:Math.round(appts*(0.85+r()*0.1)),spend:Math.round(spend*(0.95+r()*0.04))};
    } else {
      // multi-month: months of volume + months of daily budget, never a clean multiple
      const r=laRng(idSeed*131+N*7);
      const isNewer = laRng(idSeed*977)()<0.25;   // stable ~1-in-4 reads as a newer partner
      const f = isNewer ? (0.80+r()*0.07) : (0.95+r()*0.10);
      appts=Math.round(c.monthly*N*f);
      spend=Math.round(c.rate*30.4*N*f);          // same history factor so CPA stays sane
      const gf=0.80+laRng(idSeed*29+N*5)()*0.12;
      c.prev={appts:Math.round(appts*gf),spend:Math.round(spend*Math.min(0.97,gf+0.08))};
    }
    c.appts=appts; c.spend=spend;
    const ratio=2.6+laRng(idSeed*41)()*1.5;        // leads per booked appt: ~2.6-4.1x (booking rate 25-38%)
    c.leads=Math.round(appts*ratio);               // Meta-side: most leads don't book
    c.campaigns=demoCampaigns(c.trade,spend,appts,c.leads); // keep campaign table summing to current totals
    c.weekly = N<=1 ? demoWeekly(appts,spend,key==='this_month') : demoMonthly(c);
  });
}
function demoMonthly(c){
  // per-month bars at full monthly volume, varied per client+month; current month shows month-to-date
  const P=S.period; const out=[]; let idSeed=0; for(const ch of c.id) idSeed+=ch.charCodeAt(0);
  let cur=new Date(P.start.getFullYear(),P.start.getMonth(),1);
  for(let i=0;i<P.months && cur<=P.end;i++){
    const isCurrent = cur.getMonth()===TODAY.getMonth() && cur.getFullYear()===TODAY.getFullYear();
    const a = isCurrent ? Math.round(c.monthly*DAY/DPM)
                        : Math.round(c.monthly*(0.85+laRng(idSeed*100+cur.getMonth())()*0.3));
    out.push({w:MN[cur.getMonth()],a});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out;
}

function demoAppts(trade,n){
  const types={
    Concrete:['Driveway','Stamped patio','Retaining wall','Flatwork','Garage slab','Walkway & steps'],
    HVAC:['AC replacement','Furnace install','Mini split','Service call','Ductwork eval','New install'],
    Turfing:['Turf install','Pavers','Putting green','Artificial grass','Sod install'],
    Decking:['New deck build','Deck replacement','Composite deck','Deck repair','Pergola build'],
    Remodeling:['Kitchen remodel','Bath remodel','Basement finish','Whole-home reno','Flooring'],
    Roofing:['Roof replacement','Roof repair','Roof inspection','Storm-damage eval','Gutter & roof']
  }[trade]||['Consultation','Estimate','Site visit'];
  const first=['James','Linda','Tom','Sarah','Derek','Patricia','Carl','Donna','Frank','Beverly','Steven','Nancy','Brian','Karen','Mike'];
  const out=[];
  const count=Math.min(n,8);
  const upcoming=2; // first two are future bookings
  for(let i=0;i<count;i++){
    const d=new Date(TODAY);
    let status;
    if(i<upcoming){
      d.setDate(DAY + (upcoming - i)); // future: +2 days, then +1 day
      status='pe'; // Upcoming — only ever on a future date
    } else {
      const back=i-upcoming;
      d.setDate(DAY - back); // today, then going back
      status = (back%3===2) ? 'cl' : 'cf'; // past: mostly Confirmed, some Closed
    }
    out.push({date:MN[d.getMonth()]+' '+d.getDate(),name:first[i%first.length]+' '+String.fromCharCode(65+i)+'.',type:types[i%types.length],status});
  }
  return out;
}
function demoWeekly(appts,spend,partial){
  const w = partial ? [.55,.45] : [.22,.3,.28,.2]; // 10 days in = ~2 weeks elapsed
  return w.map((p,i)=>({w:'Wk '+(i+1),a:Math.round(appts*p),s:Math.round(spend*p)}));
}
function demoCampaigns(trade,spend,appts,leads){
  const names={
    Concrete:['Driveway leads','Stamped concrete','Patios & flatwork'],
    HVAC:['AC replacement','HVAC service','Mini split'],
    Turfing:['Turf install','Pavers','Putting greens'],
    Decking:['New deck builds','Composite decking','Deck repairs'],
    Remodeling:['Kitchen & bath','Whole-home reno','Basement finish'],
    Roofing:['Roof replacement','Storm damage','Roof repair']
  }[trade]||['Search campaign','Retargeting','Lookalike'];
  const sp=[.5,.32,.18], ap=[.55,.3,.15], lp=[.52,.31,.17];
  return names.map((n,i)=>({n,s:Math.round(spend*sp[i]),a:Math.max(1,Math.round(appts*ap[i])),l:Math.max(1,Math.round((leads||appts*3)*lp[i]))}));
}

async function enrichClient(c){
  const cid=c.id;
  const P=S.period;
  const startISO=dISO(P.start), endISO=dISO(P.end);
  const startD=dDATE(P.start), endD=dDATE(P.end);
  const pStartISO=dISO(P.prevStart), pEndISO=dISO(P.prevEnd);
  const pStartD=dDATE(P.prevStart), pEndD=dDATE(P.prevEnd);
  // appointments in window
  let appts=[],prevAppts=[];
  try{
    const {data}=await sb.from(CONFIG.tables.appointments).select('*').eq('client_id',cid).gte(CONFIG.cols.apptAt,startISO).lte(CONFIG.cols.apptAt,endISO);
    appts=data||[];
    const {data:pd}=await sb.from(CONFIG.tables.appointments).select('*').eq('client_id',cid).gte(CONFIG.cols.apptAt,pStartISO).lte(CONFIG.cols.apptAt,pEndISO);
    prevAppts=pd||[];
  }catch(e){}
  // metrics: spend, column is 'month' (date)
  let spend=0,prevSpend=0;
  try{
    const {data}=await sb.from(CONFIG.tables.metrics).select('*').eq('client_id',cid).gte('month',startD).lte('month',endD);
    spend=(data||[]).reduce((s,m)=>s+(Number(m[CONFIG.cols.spend])||0),0);
    const {data:pd}=await sb.from(CONFIG.tables.metrics).select('*').eq('client_id',cid).gte('month',pStartD).lte('month',pEndD);
    prevSpend=(pd||[]).reduce((s,m)=>s+(Number(m[CONFIG.cols.spend])||0),0);
  }catch(e){}

  const apptCount=appts.length;
  const prevApptCount=prevAppts.length;
  const avgJob=avgJobFor(c);
  return {
    id:cid,
    name:c.name||c.business_name||'Client',
    trade:c.trade||c.niche||'Service',
    city:c.city||[c.city,c.state].filter(Boolean).join(', ')||'',
    owner:c.owner_name||c.contact_name||c.owner||'',
    appts:apptCount, spend, avgJob,
    prev:{appts:prevApptCount,spend:prevSpend},
    appointments:appts.map(mapAppt).sort((a,b)=>b._d-a._d).slice(0,8),
    weekly:bucketAppts(appts,spend),
    campaigns:[]
  };
}
// average job value: client override if present, else trade default
function avgJobFor(c){
  const v=Number(c.avg_job_value||c.avg_job||0);
  if(v>0) return v;
  const T=TRADE_DEFAULTS[tradeKey(c.trade||c.niche||'Service')]||TRADE_DEFAULTS.Service;
  return T.avgJ;
}
// projection helpers — appointments → potential at 50% close rate
function projJobs(appts){ return Math.round(appts*CONFIG.closeRate); }
function projRev(appts,avgJob){ return Math.round(appts*CONFIG.closeRate*avgJob); }
function mapAppt(a){
  const d=new Date(a[CONFIG.cols.apptAt]||0);
  let st='pe';
  const raw=(a.status||'').toLowerCase();
  if(d<TODAY){ st = raw.includes('clos')||raw.includes('won')?'cl': raw.includes('no')?'ns':'cf'; }
  else { st='pe'; }
  return {_d:d,date:MN[d.getMonth()]+' '+d.getDate(),name:a.contact_name||a.name||'Contact',type:a.notes||'Appointment',status:st};
}
// buckets appointments by week (single month) or by month (multi-month) for the chart
function bucketAppts(appts,spend){
  const P=S.period;
  if(P.months<=1){
    const w=[0,0,0,0];
    appts.forEach(a=>{const day=new Date(a[CONFIG.cols.apptAt]||0).getDate();w[Math.min(3,Math.floor((day-1)/7))]++;});
    return w.map((a,i)=>({w:'Wk '+(i+1),a}));
  }
  const buckets={};
  const order=[];
  let cur=new Date(P.start.getFullYear(),P.start.getMonth(),1);
  while(cur<=P.end){ const k=MN[cur.getMonth()]; buckets[k]=0; order.push(k); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }
  appts.forEach(a=>{const d=new Date(a[CONFIG.cols.apptAt]||0);const k=MN[d.getMonth()];if(k in buckets)buckets[k]++;});
  return order.map(k=>({w:k,a:buckets[k]}));
}

/* ════════════════════════════════════════════════════════════
   PACE / HEALTH
   ════════════════════════════════════════════════════════════ */
function pace(appts, p){
  p = p || S.period;
  const target = Math.max(1, Math.round(CONFIG.guarantee * p.months));
  let proj=null, ref, st, col, pc;
  if(p.key==='this_month'){
    proj = DAY>0 ? Math.round(appts/DAY*DPM*10)/10 : 0;
    ref = proj;
  } else {
    ref = appts;
  }
  if(ref>=target){ st = p.key==='this_month'?'On track':'Met'; col='#248A3D'; pc='on'; }
  else if(ref>=target*.8){ st = p.key==='this_month'?'At risk':'Close'; col='#C25E00'; pc='at'; }
  else { st = p.key==='this_month'?'Behind':'Below'; col='#D70015'; pc='bh'; }
  return {target, proj, st, col, pc, rem: p.key==='this_month'?DPM-DAY:0, needed:Math.max(0,target-appts)};
}

/* ════════════════════════════════════════════════════════════
   LIVE ACTIVITY CALENDAR (demo only — fully simulated, no real data)
   Deterministic per-day via seeded PRNG so it's consistent for every
   viewer on a given date and grows as the month progresses.
   ════════════════════════════════════════════════════════════ */
const LA_TRADES=[
  {key:'Concrete', label:'Concrete partner', density:1.15, jobs:['Driveway estimate','Stamped patio','Retaining wall','Flatwork quote','Garage slab','Walkway & steps','Pool deck']},
  {key:'HVAC', label:'HVAC partner', density:1.25, jobs:['AC replacement','Furnace install','Mini-split quote','System tune-up','Ductwork eval','New install estimate']},
  {key:'Remodeling', label:'Remodeling partner', density:1.0, jobs:['Kitchen consult','Bath remodel','Whole-home estimate','Basement finish','Balcony rebuild','Flooring quote']},
  {key:'Roofing', label:'Roofing partner', density:1.1, jobs:['Roof inspection','Full replacement','Storm-damage eval','Repair estimate','Gutter & roof quote']}
];
const LA_FIRST=['James','Linda','Tom','Sarah','Derek','Patricia','Carl','Donna','Frank','Beverly','Steven','Nancy','Brian','Karen','Mike','Susan','Greg','Angela','Paul','Diane','Kevin','Laura','Scott','Rachel','Tony','Maria','Doug','Cheryl','Wayne','Holly','Victor','Tina','Ralph','Joan','Bruce','Gail'];
let LA_state={trade:0};

// tiny deterministic PRNG (mulberry32) so the board is stable per seed
function laRng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function renderLiveActivity(){
  const td=LA_TRADES[LA_state.trade];
  const y=TODAY.getFullYear(), m=TODAY.getMonth();
  const first=new Date(y,m,1), startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();

  // build per-day booking lists, seeded by month+day+trade
  const dayEvents={};
  let monthTotal=0, todayNew=0;
  for(let d=1; d<=daysInMonth; d++){
    const dow=new Date(y,m,d).getDay();
    if(dow===0){ dayEvents[d]=[]; continue; } // no Sunday bookings
    const rng=laRng((y*10000)+(m*100)+d + LA_state.trade*7919);
    // weekday booking density; Saturdays lighter
    let base = dow===6 ? 0.6 : 1.0;
    let n = Math.round((1 + rng()*2.4) * td.density * base); // ~1-4 per active day
    if(d>TODAY.getDate()) n=Math.max(0,Math.round(n*0.45)); // future days lighter (still filling)
    const evs=[];
    for(let i=0;i<n;i++){
      const fn=LA_FIRST[Math.floor(rng()*LA_FIRST.length)];
      const li=String.fromCharCode(65+Math.floor(rng()*26));
      const job=td.jobs[Math.floor(rng()*td.jobs.length)];
      const isNew = d===TODAY.getDate(); // "landed today"
      evs.push({nm:fn+' '+li+'.', job, isNew});
      if(d<=TODAY.getDate()) monthTotal++;
      if(isNew) todayNew++;
    }
    dayEvents[d]=evs;
  }

  // calendar cells
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday=d===TODAY.getDate();
    const isFuture=d>TODAY.getDate();
    const evs=dayEvents[d]||[];
    const shown=evs.slice(0,3);
    const extra=evs.length-shown.length;
    const evHtml=shown.map(e=>`<div class="cal-ev ${e.isNew?'new':''}"><span class="nm">${esc(e.nm)}</span> · ${esc(e.job)}</div>`).join('');
    const moreHtml=extra>0?`<div class="cal-more">+${extra} more</div>`:'';
    const newBadge=isToday&&todayNew>0?`<div class="cal-newbadge">+${todayNew} today</div>`:'';
    cells+=`<div class="cal-cell ${isToday?'today':''} ${isFuture?'future':''}">${newBadge}<div class="cal-dn">${d}</div>${evHtml}${moreHtml}</div>`;
  }

  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const avgPerDay=(monthTotal/Math.max(1,TODAY.getDate())).toFixed(1);

  el('view').innerHTML=`
  <div class="la-hd">
    <div class="la-live"><span class="dot"></span> Live · updates daily</div>
    <div class="t serif">A glimpse of how our partners are performing</div>
    <div class="s">This is a real-time look at booking activity across a Hammer List partner account. Names are hidden for privacy — but the volume is real. New appointments land every day.</div>
  </div>

  <div class="cal-toolbar">
    <div class="cal-pills">
      ${LA_TRADES.map((t,i)=>`<button class="cal-pill ${LA_state.trade===i?'act':''}" onclick="laSwitch(${i})">${esc(t.label)}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--ink-2)">${MN[m]} ${y}</div>
  </div>

  <div class="grid4" style="margin-bottom:15px">
    <div class="la-stat gn"><span class="lbl">Booked this month</span><div class="n">${monthTotal}</div><div class="sub">and counting</div></div>
    <div class="la-stat"><span class="lbl">New today</span><div class="n">+${todayNew}</div><div class="sub">landed in the last 24h</div></div>
    <div class="la-stat"><span class="lbl">Avg / day</span><div class="n">${avgPerDay}</div><div class="sub">appointments booked</div></div>
    <div class="la-stat"><span class="lbl">Day of month</span><div class="n">${TODAY.getDate()}/${daysInMonth}</div><div class="sub">${MN[m]}</div></div>
  </div>

  <div class="card">
    <div class="cal-grid" style="margin-bottom:6px">${dows}</div>
    <div class="cal-grid">${cells}</div>
  </div>

  <div class="la-note">Partner identity and homeowner details are hidden. Booking volume reflects a live partner account.</div>`;
}
function laSwitch(i){ LA_state.trade=i; renderLiveActivity(); }

        <div><div class="cc-mini-l">Proj. rev</div><div class="cc-mini-v">${f$(c._proj)}</div></div>
        <div><div class="cc-mini-l">Proj. ROAS</div><div class="cc-mini-v">${roasC}×</div></div>`}

      </div>
      <div class="cc-f"><span>${esc(c.owner||'')}</span><span>${S.demo?esc(c.city||''):''}</span></div>
    </div>`;
  });
  html+=`</div>`;
  el('view').innerHTML=html;
}

function renderClientView(){
  const c=S.clients.find(x=>x.id===S.activeClientId);

        <div class="card sur" style="margin:0;padding:11px 13px"><span class="lbl">Avg / month</span><div class="serif" style="font-size:18px">${(c.appts/S.period.months).toFixed(1)}</div><div class="sub">over ${S.period.months} months</div></div>
        <div class="card sur" style="margin:0;padding:11px 13px"><span class="lbl">Vs target</span><div class="serif" style="font-size:18px;color:${p.col}">${c.appts>=p.target?'+':''}${c.appts-p.target}</div><div class="sub">${c.appts>=p.target?'above':'below'} guarantee</div></div>
        `}
        ${S.demo?`<div class="card sur" style="margin:0;padding:11px 13px"><span class="lbl">Cost / lead</span><div class="serif" style="font-size:18px;color:var(--ok)">$${cpl}</div><div class="sub">${fN(c.leads||0)} leads → ${fN(c.appts)} booked</div></div>`:`<div class="card sur" style="margin:0;padding:11px 13px"><span class="lbl">Projected revenue</span><div class="serif" style="font-size:18px;color:var(--ok)">${f$(proj)}</div><div class="sub">${pjobs} jobs × ${f$(c.avgJob)}</div></div>`}
      </div>
    </div>
  </div>

  <div class="grid4" style="margin-bottom:14px">
    ${metrics.map(m=>`<div class="mc ${m.g?'gn':''}"><div class="mc-l">${m.l}</div><div class="mc-v">${m.v}</div><div class="mc-m">${m.d}<span class="mc-s">${m.s}</span></div></div>`).join('')}

      <div style="display:grid;grid-template-columns:54px 1fr auto auto;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)"><span class="th">Date</span><span class="th">Contact</span><span class="th">Type</span><span class="th">Status</span></div>

    ${campRows}
  </div>
  ${nsAlert}`;
  el('view').innerHTML=html;
  drawWeekly(c);
}

let chWk=null;
function drawWeekly(c){
  const cv=el('cv-wk'); if(!cv||!window.Chart) return;

};
function tradeKey(trade){ return TRADE_DEFAULTS[trade]?trade:'Service'; }
let bid=0;
function defaultBudget(c){
  const T=TRADE_DEFAULTS[tradeKey(c.trade)];
  return {
    rev:projRev(c.appts,c.avgJob)||0, cj:projJobs(c.appts)||0, otherRev:0, otherExp:0,
    matPct:T.mat, labPct:T.lab, subPct:T.sub,
    ohItems:T.oh.map(([n,cat,a])=>({id:bid++,n,c:cat,a})).concat([{id:bid++,n:'Hammer List retainer',c:'Marketing',a:2200}]),
    jobType:'', jMat:Math.round(c.avgJob*T.mat/100)||0, jLab:Math.round(c.avgJob*T.lab/100)||0, tgtM:Math.round((T.bG[0]+T.bG[1])/2),
    annGoal:Math.max(120000,projRev(c.appts,c.avgJob)*12), cfAp:c.appts||8, cfCr:Math.round(CONFIG.closeRate*100),
    btab:'pl'
  };
}
async function renderBudget(){
  const c=S.clients.find(x=>x.id===S.activeClientId);
  if(!c){ goPortfolio(); return; }
  el('view').innerHTML='<div class="spin"></div>';
  if(!S.budget){
    let saved=null;
    if(!S.demo){
      try{ const {data}=await sb.from(CONFIG.tables.budget).select('data').eq('client_id',c.id).maybeSingle(); if(data&&data.data) saved=data.data; }catch(e){}
    }
    const base=defaultBudget(c);
    S.budget = saved ? Object.assign(base,saved,{ohItems:(saved.ohItems||base.ohItems).map(o=>({id:bid++,n:o.n,c:o.c,a:o.a}))}) : base;
    // always refresh live-sourced fields from current dashboard data
    if(!saved){ S.budget.rev=projRev(c.appts,c.avgJob)||0; S.budget.cj=projJobs(c.appts)||0; }
  }
  drawBudget(c);
}
function bupd(k,v){
  const num=['rev','cj','otherRev','otherExp','matPct','labPct','subPct','jMat','jLab','tgtM','annGoal','cfAp','cfCr'];
  S.budget[k]= num.includes(k)? (Number(v)||0) : v;
  const c=S.clients.find(x=>x.id===S.activeClientId);
  drawBudget(c);
}
function bswitch(t){ S.budget.btab=t; drawBudget(S.clients.find(x=>x.id===S.activeClientId)); }
function updOH(id,v){ const it=S.budget.ohItems.find(x=>x.id===id); if(it){it.a=Number(v)||0; drawBudget(S.clients.find(x=>x.id===S.activeClientId));} }
function delOH(id){ S.budget.ohItems=S.budget.ohItems.filter(x=>x.id!==id); drawBudget(S.clients.find(x=>x.id===S.activeClientId)); }
function addOH(){ S.budget.ohItems.push({id:bid++,n:'New item',c:'Other',a:0}); drawBudget(S.clients.find(x=>x.id===S.activeClientId)); setTimeout(()=>{const inp=document.querySelector('#oh-list .oh-name:last-child');if(inp)inp.focus();},30); }
function updOHName(id,v){ const it=S.budget.ohItems.find(x=>x.id===id); if(it)it.n=v; }
async function saveBudget(){
  if(S.demo){ toast('Demo — not saved'); return; }
  const c=S.clients.find(x=>x.id===S.activeClientId);
  const payload={ client_id:c.id, data:S.budget, updated_at:new Date().toISOString() };
  try{
    const {error}=await sb.from(CONFIG.tables.budget).upsert(payload,{onConflict:'client_id'});
    if(error) throw error;
    toast('Saved ✓');
  }catch(e){ toast('Save failed'); }
}

function budgetCalc(c){
  const T=TRADE_DEFAULTS[tradeKey(c.trade)], b=S.budget;
  const tRev=b.rev+b.otherRev;
  const mC=Math.round(tRev*b.matPct/100),lC=Math.round(tRev*b.labPct/100),sC=Math.round(tRev*b.subPct/100);
  const dC=mC+lC+sC,dPct=b.matPct+b.labPct+b.subPct;
  const gp=tRev-dC,gm=tRev>0?Math.round(gp/tRev*100):0;
  const tOH=b.ohItems.reduce((s,x)=>s+(Number(x.a)||0),0);
  const ohPJ=b.cj>0?Math.round(tOH/b.cj):0;
  const np=gp-tOH-b.otherExp,nm=tRev>0?Math.round(np/tRev*100):0;
  const tjc=b.jMat+b.jLab+ohPJ;
  const rp=b.tgtM<100?Math.round(tjc/(1-b.tgtM/100)):0;
  const mkPct=tjc>0?Math.round((rp-tjc)/tjc*100):0;
  const gpPJ=Math.round(T.avgJ*(1-dPct/100));
  const beJ=gpPJ>0?Math.ceil(tOH/gpPJ):0;
  const mGoal=Math.round(b.annGoal/12);
  const gJ=gpPJ>0?Math.ceil((tOH+mGoal)/gpPJ):0;
  const cfM=Array.from({length:6},(_,i)=>{
    const mi=(TODAY.getMonth()+i)%12,s=T.seas[mi];
    const ap=Math.round(b.cfAp*s),jo=Math.round(ap*b.cfCr/100),rv=jo*T.avgJ,dc=Math.round(rv*dPct/100);
    return{month:MN[mi],rev:rv,costs:dc+tOH,net:rv-dc-tOH};
  });
  return{T,b,tRev,mC,lC,sC,dC,dPct,gp,gm,tOH,ohPJ,np,nm,tjc,rp,mkPct,gpPJ,beJ,mGoal,gJ,cfM};
}

function drawBudget(c){
  const x=budgetCalc(c), b=S.budget;

  </div>
  <div id="budget-body"></div>`;

function bBE(x){
  const{T,b,tOH,gpPJ,beJ,gJ,mGoal,dPct}=x;

  let alert;
  if(b.cj<beJ) alert=`<div class="alert alert-bad" style="margin-top:24px"><span>⚠</span><div><strong>${beJ-b.cj} more job${beJ-b.cj!==1?'s':''}</strong> needed to cover overhead this month.</div></div>`;
  else if(b.cj<gJ) alert=`<div class="alert alert-warn" style="margin-top:24px"><span>◐</span><div>Overhead covered ✓ — <strong>${gJ-b.cj} more job${gJ-b.cj!==1?'s':''}</strong> to hit your income target.</div></div>`;
  else alert=`<div class="alert alert-ok" style="margin-top:24px"><span>✓</span><div>Income target on track — every extra job this month is pure profit.</div></div>`;
  return `
  <div class="grid2" style="margin-bottom:13px">
    <div class="card"><span class="lbl">Avg job value (${esc(cTrade)})</span><div class="num">${f$(T.avgJ)}</div><div class="sub">trade default</div></div>
    <div class="card gs"><span class="lbl">Gross profit / job</span><div class="num">${f$(gpPJ)}</div><div class="sub">after ${dPct}% direct costs</div></div>
  </div>
  <div class="card sur"><div style="font-size:12px;font-weight:500;margin-bottom:9px">Break-even calculation</div>
    ${[['Monthly overhead',f$(tOH)],['Gross profit per job',f$(gpPJ)]].map(([l,v])=>`<div class="row"><span style="font-size:11px;color:var(--ink-2)">${l}</span><span class="serif" style="font-size:12px">${v}</span></div>`).join('')}
    <div class="row"><span style="font-size:12px;font-weight:500">Jobs to break even</span><span class="serif" style="font-size:17px;color:var(--green-l)">${beJ} / month</span></div>
  </div>
  <div class="card"><div style="font-size:12px;font-weight:500;margin-bottom:11px">Income goal</div>
    <div style="margin-bottom:11px"><span class="lbl">Annual income target</span><div style="max-width:210px"><input class="inp serif" type="number" value="${b.annGoal}" oninput="bupd('annGoal',this.value)"></div></div>
    <div class="card sur" style="margin:0"><div class="sub" style="margin:0 0 2px">To cover overhead + hit this goal</div><div class="serif" style="font-size:22px">${gJ} jobs/month</div><div class="sub">${f$(mGoal)}/mo · ${Math.max(0,gJ-beJ)} jobs above break-even</div></div>
  </div>
  <div class="card"><div style="font-size:12px;font-weight:500;margin-bottom:16px">Monthly jobs tracker</div>
    <div style="position:relative;background:var(--surface-2);border-radius:100px;height:12px">
      <div style="width:${Math.min(Math.round(b.cj/maxJ*100),100)}%;height:100%;background:${barCol};border-radius:100px;transition:width .4s"></div>
      <div style="position:absolute;top:-3px;left:${pct(beJ)}%;width:2px;height:18px;background:#D70015"><span style="position:absolute;top:20px;left:-12px;font-size:8px;color:var(--bad);white-space:nowrap">BE: ${beJ}</span></div>
      <div style="position:absolute;top:-3px;left:${pct(gJ)}%;width:2px;height:18px;background:var(--green-l)"><span style="position:absolute;top:20px;left:-14px;font-size:8px;color:var(--green-l);white-space:nowrap">Goal: ${gJ}</span></div>
    </div>
    <div style="margin-top:30px;display:flex;justify-content:space-between;font-size:10px;color:var(--ink-2)"><span>0</span><span style="font-weight:500;color:var(--ink)">Now: ${b.cj} jobs</span><span>${maxJ}</span></div>
    ${alert}
  </div>`;
}

function bCF(x){
  const{T,b,cfM,tOH}=x;
  const gaps=cfM.filter(r=>r.net<0).map(r=>r.month);
  return `
  <div class="card sur"><div style="font-size:12px;font-weight:500;margin-bottom:12px">Projection inputs</div>
    <div class="grid2" style="margin-bottom:11px">
      <div><span class="lbl">Appointments / month</span><input class="inp serif" type="number" value="${b.cfAp}" oninput="bupd('cfAp',this.value)"></div>
      <div><span class="lbl">Close rate %</span><input class="inp serif" type="number" value="${b.cfCr}" oninput="bupd('cfCr',this.value)"></div>
    </div>
    <div style="padding:7px 10px;background:var(--line);border-radius:6px;font-size:10px;color:var(--ink-2)">Seasonal pattern for ${esc(tradeKey(S.clients.find(y=>y.id===S.activeClientId).trade))} · avg job ${f$(T.avgJ)} · overhead ${f$(tOH)}/mo</div>
  </div>
  <div class="card"><div class="sec-t" style="font-size:13px">6-month forecast</div><div class="sec-s">Revenue vs total costs · seasonal pattern applied</div>
    <div style="position:relative;height:175px"><canvas id="cv-cf" role="img" aria-label="6 month revenue vs costs">Forecast.</canvas></div>
    <div style="display:flex;gap:14px;margin-top:10px;font-size:10px;color:var(--ink-2)"><span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:#0071e3"></span>Revenue</span><span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:#FF9500"></span>Total costs</span></div>
  </div>
  <div class="card"><div class="sec-t" style="font-size:13px">Monthly breakdown</div>
    <div style="display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)"><span class="th">Month</span><span class="th" style="text-align:right">Revenue</span><span class="th" style="text-align:right">Costs</span><span class="th" style="text-align:right">Net</span></div>
    ${cfM.map((r,i)=>`<div style="display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:center"><span style="font-size:11px;font-weight:${i===0?500:400};color:${i===0?'var(--green-l)':'var(--ink)'}">${r.month}${i===0?' ▸':''}</span><span class="serif" style="font-size:12px;text-align:right">${f$(r.rev)}</span><span class="serif" style="font-size:12px;text-align:right;color:var(--ink-2)">${f$(r.costs)}</span><span class="serif" style="font-size:12px;text-align:right;color:${r.net>=0?'var(--green-l)':'var(--bad)'}">${f$(r.net)}</span></div>`).join('')}
  </div>
  ${gaps.length?`<div class="alert alert-warn"><span>⚠</span><div><strong>Cash gap in ${gaps.join(', ')}</strong> — pre-book before the slow period or pull ad spend forward.</div></div>`:`<div class="alert alert-ok"><span>✓</span><div>No cash gaps projected in this 6-month window. Seasonal pattern looks stable.</div></div>`}`;
}
let chCF=null;
function drawCF(x){
  const cv=el('cv-cf'); if(!cv||!window.Chart) return;
  const ex=window.Chart.getChart(cv); if(ex) ex.destroy();
  chCF=new window.Chart(cv,{type:'bar',data:{labels:x.cfM.map(r=>r.month),datasets:[
    {label:'Revenue',data:x.cfM.map(r=>r.rev),backgroundColor:'rgba(0,113,227,.16)',borderColor:'#0071e3',borderWidth:1.5,borderRadius:3},
    {label:'Costs',data:x.cfM.map(r=>r.costs),backgroundColor:'rgba(255,149,0,.16)',borderColor:'#FF9500',borderWidth:1.5,borderRadius:3}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#86868b'},border:{display:false}},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10},color:'#86868b',callback:v=>'$'+(v>=1000?Math.round(v/1000)+'k':v)},border:{display:false}}}}});
}

/* allow Enter to submit login */
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&el('login').style.display!=='none') doLogin(); });

init();
</script>
</body>
</html>
